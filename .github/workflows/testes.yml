name: Testes

on:
  push:
    branches: ["**"]
    # Uma tag v* publica o executável na aba Releases, para baixar sem login.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Servidor de CI não tem tela: o Qt usa o backend offscreen.
  QT_QPA_PLATFORM: offscreen

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 é a versão mínima pedida no README; 3.12 é a que o usuário instala hoje.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Preparar o Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar bibliotecas de sistema do Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Instalar as dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rodar os testes
        run: python -m pytest

      - name: Conferir que a interface e a API carregam
        run: |
          python -c "
          import app.ui.main_window, app.ui.login_window, app.ui.staff_home
          import app.ui.charges, app.ui.charge_dialogs
          from app.api.server import create_app
          create_app()
          print('interface e API carregam')
          "

      - name: Verificar a instalação
        run: python main.py --verificar

  # O executável do Windows é montado por empacotamento: uma biblioteca que o
  # PyInstaller não enxerga só falha no programa pronto. Este job monta o
  # pacote de verdade e roda a auto-verificação sobre o binário.
  empacotamento:
    runs-on: windows-latest
    permissions:
      # Necessário apenas para publicar o release quando uma tag é enviada.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar as dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Gerar o executável
        run: python -m PyInstaller --noconfirm --clean SYS_Crediario.spec

      - name: Verificar o executável gerado
        run: .\dist\SYS_Crediario.exe --verificar

      - name: Guardar o executável
        uses: actions/upload-artifact@v4
        with:
          name: SYS_Crediario-exe
          path: dist/SYS_Crediario.exe
          if-no-files-found: error

      - name: Publicar na aba Releases (somente em tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/SYS_Crediario.exe
          --title "SYS CREDIÁRIO ${{ github.ref_name }}"
          --notes "Executável para Windows da Ótica Visão, gerado e verificado automaticamente pelo CI. Baixe o SYS_Crediario.exe, coloque em qualquer pasta e abra — não precisa de Python. Os dados ficam em C:\Users\SEU_USUARIO\SYS_Crediario e nunca são apagados ao atualizar o programa."
