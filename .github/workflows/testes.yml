name: Testes

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 é a versão mínima pedida no README; 3.12 é a que o usuário instala hoje.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Preparar o Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar as dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rodar os testes
        run: python -m pytest

      - name: Conferir que a interface e a API carregam
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Bibliotecas de sistema que o Qt exige para importar em servidor sem tela.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python -c "
          import app.ui.main_window, app.ui.login_window
          from app.api.server import create_app
          create_app()
          print('interface e API carregam')
          "
